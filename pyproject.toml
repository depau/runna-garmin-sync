[project]
name = "runna-garmin-sync"
dynamic = ["version"]
description = "Sync Runna strength workouts to Garmin Connect"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apprise>=1.12.0",
    "click>=8.4.2",
    "curl-cffi>=0.16.0",
    "garminconnect>=0.3.10",
]

[project.scripts]
runna-garmin-sync = "runna_garmin_sync.__main__:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }  # tarball/no-git builds

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

