# Runna GraphQL operations — extracted from the app bundle (com.runbuddy.prod v8.42.0)
# 542 unique documents (Apollo literals from the Hermes JS bundle), GraphQL-validated.
# Reference only: names + field selections as the app ships them. Send your own minimal queries
# against https://hydra.platform.runna.com/graphql (see runna-api.md for transport/auth).
# Sorted by type then name. Input-type shapes are NOT here (introspection is disabled).

query AllOrders {
  userProfile {
    id
    unitOfMeasurementV2
  }
  getAllOrders {
    id
    planId
    completed
    createdOn
    customPlanName
    disabled
    runningModelVersion
    planEndDate
    plan {
      ...PlanFragment
    }
    race {
      id
      image
      imageUrl
    }
  }
  getActiveOrderDetails {
    id
    planId
    customPlanName
    disabled
    runningModelVersion
    planV2 {
      ...PlanFragment
    }
    race {
      id
      image
      imageUrl
    }
  }
}

query CanScheduleOrder($input: CanScheduleOrderInput!) {
  canScheduleOrder(input: $input) {
    result
    conflicts {
      orderId
      reason
    }
  }
}

query CheckEmailAddress($email: String!) {
