query GetActivityDetails($id: ID!) {
  userProfile {
    id
    picture
    unitOfMeasurementV2
    stravaToken {
      accessToken
    }
    isLevelsEnabled
  }
  getActiveOrderDetails {
    id
    customPlanName
    plan {
      estimatedActiveWeekTimes {
        key
        secs
        display
      }
      activeWeekIndex
    }
    planV2 {
      id
      shortPlanName
      iconText
      color
    }
  }
  getActivityDetails(id: $id) {
    id
    summary {
      id
      type
      treadmillType
      name
      description
      privateNote
      address
      tzOffset
      mapPolyline
      routeSVG
      createdOn
      workoutId
      recordType
      deviceName
      pbs
      activePbs
      predictedRunType
      feedback
      detailedFeedback
      points
      fastestTimes {
        type
        time
        distance
      }
      linkedToWorkout
      runType
      duplicateActivitiesInfo {
        id
        recordType
      }
      plannedWorkoutMetadataV2 {
        ... on WorkoutMetadataV2 {
          day {
            ...FullDayMetadata
          }
          weekIndex
          planDetails {
            id
            planLength
            shortPlanName
          }
        }
      }
      instantWorkoutMetadata {
        day {
          ...FullDayMetadata
        }
      }
      summary {
        startTimestamp
        endTimestamp
        movingTime
        totalTime
        distance
        averageSpeed
        maxSpeed
        elevationGain
        maxElevation
        minElevation
        averageHeartRate
        maxHeartRate
        minHeartRate
        averageCadence
        maxCadence
        calories
        averagePower
        maxPower
        averageGroundContactTime
        maxGroundContactTime
        averageStrideLength
        maxStrideLength
        averageVerticalOscillation
        maxVerticalOscillation
      }
      kmSplits
      mileSplits
      shoe {
        id
        active
        brand
        color
        createdOn
        distance
        model
        name
        runs
        targetDistance
        time
        visible
        retired
      }
      averageGpsAccuracy
      postRunSummary {
        ...PostRunSummaryMetadata
      }
      strengthTrackedExercises {
        exerciseId
        sets {
          elapsedTime
          weightKg
          reps
        }
      }
      stravaActivities {
        stravaActivityId
      }
    }
    chartData {
      chartStreams {
        pace {
          x
          y
        }
        heartRate {
          x
          y
        }
        elevation {
          x
          y
        }
      }
      laps {
        startTimestamp
        startCoordinate {
          latitude
          longitude
        }
        endCoordinate {
          latitude
          longitude
        }
        distance
        movingTime
        totalTime
        averageSpeed
        maxSpeed
        elevationGain
        maxElevation
        minElevation
        averageHeartRate
        maxHeartRate
        minHeartRate
        averageCadence
        maxCadence
        calories
      }
      heartRateZoneSummary {
        zone
        minBPM
        maxBPM
        percentage
        timeMs
      }
    }
  }
}

